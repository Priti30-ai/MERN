<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Contact - Node.js Web Server</title>

        <link rel="stylesheet" href="/style.css">
    </head>

    <body>

        <nav class="navbar">

            <div class="logo">
                Node.js Server
            </div>

            <div class="nav-links">
                <a href="/home">Home</a>
                <a href="/about">About</a>
                <a href="/contact" class="active">Contact</a>
            </div>

        </nav>

        <main class="container">

            <section class="page-header">

                <div class="badge">
                    Get In Touch
                </div>

                <h1>
                    Contact Us
                </h1>

                <p>
                    If you have any questions about this project,
                    you can use the contact information below.
                </p>

            </section>

            <section class="contact-section">

                <div class="contact-card">

                    <div class="contact-icon">
                        @
                    </div>

                    <h2>Email</h2>

                    <p>
                        example@example.com
                    </p>

                </div>

                <div class="contact-card">

                    <div class="contact-icon">
                        #
                    </div>

                    <h2>Phone</h2>

                    <p>
                        +91 00000 00000
                    </p>

                </div>

                <div class="contact-card">

                    <div class="contact-icon">
                        #
                    </div>

                    <h2>Location</h2>

                    <p>
                        Maharashtra, India
                    </p>

                </div>

            </section>

        </main>

        <footer>
            <p>
                Node.js Web Server &copy; 2026
            </p>
        </footer>

    </body>

</html>
