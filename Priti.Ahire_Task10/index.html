<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LaundryCare Animation</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <!-- Header with logo, menu, and user button -->
        <header>
            <h2 class="logo">LaundryCare</h2>

            <nav class="navbar">
                <a href="#">Home</a>
                <a href="#">Services</a>
                <a href="#">About Us</a>
                <a href="#">Contact Us</a>
            </nav>

            <button class="user-btn">Priti Ahire</button>
        </header>

        <!-- Main hero section -->
        <section class="hero">
            <div class="content">
                <h1>
                    Revitalize Your <br>
                    Clothes with Expert <br>
                    <span>Laundry Services!</span>
                </h1>

                <p>
                    From premium dry cleaning to quick wash and fold,
                    we deliver care and convenience for every garment.
                </p>

                <button class="book">Book a Service Today!</button>
            </div>

            <!-- Image that will move in an orbit -->
            <div class="orbit-img">
                <div class="image">
                    <img
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_3nJslNvBSohwwnST1TEath0cmhzX9zMB64toxbvgVQ&s=10"
                        alt="Laundry Service">
                </div>
            </div>
        </section>

    </body>
</html>
