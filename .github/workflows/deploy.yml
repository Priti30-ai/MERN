name: Deploy Task 30 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Priti.Ahire_Task30/package-lock.json

      - name: Install dependencies
        working-directory: Priti.Ahire_Task30
        run: npm ci

      - name: Build
        working-directory: Priti.Ahire_Task30
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -R Priti.Ahire_Task30/dist/. _site/
          mkdir -p _site/Priti.Ahire_Task32/API_Documentation
          cp Priti.Ahire_Task32/index.html _site/Priti.Ahire_Task32/
          cp Priti.Ahire_Task32/API_Documentation/API_Documentation.html _site/Priti.Ahire_Task32/API_Documentation/
          cp Priti.Ahire_Task32/API_Documentation/API_Documentation.pdf _site/Priti.Ahire_Task32/API_Documentation/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4