<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Color Box</title>

        <link rel="stylesheet" href="style.css">

    </head>
    <body>

        <div class="main">

            <h1 id="heading">Hello</h1>

            <div class="boxes">
                <div class="box" data-color="red">red</div>
                <div class="box" data-color="blue">blue</div>
                <div class="box" data-color="green">green</div>
                <div class="box" data-color="yellow">yellow</div>
            </div>

            <input type="text" id="name" placeholder="Enter your name">

            <button id="button">Greet</button>

        </div>

        <script src="script.js"></script>

    </body>
</html>
